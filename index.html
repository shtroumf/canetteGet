<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consignes — Cueillette</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: .75rem;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(.75rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
    text-align: center;
  }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 0; }
  #primary-actions { position: sticky; top: 0; z-index: 5; display: grid; gap: .65rem; width: min(100%, 34rem); padding: .5rem; border-bottom: 1px solid #30363d; background: #0d1117; text-align: left; }
  #address-label { display: block; margin-bottom: .3rem; color: #e6edf3; font-size: .95rem; font-weight: 600; }
  #adresse { display: block; width: 100%; min-height: 3.25rem; padding: .7rem .8rem; border: 1px solid #697582; border-radius: 6px; background: #161b22; color: #e6edf3; font: inherit; line-height: 1.3; }
  #adresse::placeholder { color: #9198a1; }
  #adresse:focus { outline: 2px solid #58a6ff; outline-offset: 2px; }
  #address-help { display: block; margin-top: .25rem; color: #9198a1; font-size: .8rem; }
  #btn {
    width: 100%;
    min-height: 3.5rem;
    background: #2ea043;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: .7rem 1rem;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease;
  }
  #btn:hover:not(:disabled) { background: #3fb950; }
  #btn:focus-visible { outline: 3px solid #58a6ff; outline-offset: 2px; }
  #btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
  #status { min-height: 2.5em; font-size: .95rem; color: #9198a1; max-width: 34em; line-height: 1.4; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #progress { display: grid; gap: .45rem; width: min(100%, 34rem); list-style: none; text-align: left; }
  #progress li { display: grid; grid-template-columns: 1.25rem 1fr; column-gap: .45rem; color: #737d88; font-size: .9rem; line-height: 1.4; }
  #progress li::before { grid-row: span 2; content: "•"; text-align: center; }
  #progress li.current { color: #e3b341; }
  #progress li.current::before { align-self: start; justify-self: center; width: .72rem; height: .72rem; margin: .12rem; border: 2px solid #5b4d2b; border-top-color: #e3b341; border-radius: 50%; content: ""; animation: spin .8s linear infinite; }
  #progress li.done { color: #3fb950; }
  #progress li.done::before { content: "✓"; }
  #progress li.error { color: #f85149; }
  #progress li.error::before { content: "!"; }
  #progress small { color: #9198a1; }
  #coordinates { color: #aab2bc; font-size: .85rem; font-variant-numeric: tabular-nums; }
  #map-card { width: min(100%, 36rem); }
  #map-frame { display: none; width: 100%; height: min(18rem, 40vh); min-height: 12rem; border: 1px solid #30363d; border-radius: 6px; background: #161b22; }
  .err { color: #f85149 !important; }
  .ok  { color: #3fb950 !important; }
  @media (prefers-reduced-motion: reduce) { #progress li.current::before { animation: none; } }
  @media (max-width: 480px) { #map-frame { height: min(15rem, 38vh); } #btn { font-size: 1rem; } }
  @media (orientation: landscape) and (max-height: 500px) {
    body { gap: .4rem; padding: .4rem max(.75rem, env(safe-area-inset-left)) .75rem; }
    h1 { font-size: 1.25rem; }
    #primary-actions { grid-template-columns: minmax(0, 1fr) minmax(12rem, .8fr); align-items: end; gap: .5rem; padding: .35rem .5rem; }
    #address-entry { min-width: 0; }
    #btn { min-height: 3.25rem; }
    #progress { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .25rem .75rem; }
    #map-frame { height: 12rem; min-height: 10rem; }
  }
</style>
</head>
<body>
  <h1>♻️ Consignes</h1>
  <section id="primary-actions" aria-label="Adresse et demande de cueillette">
    <div id="address-entry">
      <label id="address-label" for="adresse">Adresse :</label>
      <input id="adresse" type="text" placeholder="Ex. 123 rue Principale" autocomplete="address-line1" autocapitalize="words" enterkeyhint="done" aria-describedby="address-help">
      <small id="address-help">Numéro civique et nom de rue seulement.</small>
    </div>
    <button id="btn" disabled>Venez cueillir mes consignes !</button>
  </section>
  <p id="status" role="status" aria-live="polite">Initialisation…</p>
  <ol id="progress" aria-label="Progression du chargement" aria-live="polite" aria-atomic="false">
    <li><span>Préparation de la page</span><small>En attente</small></li>
    <li><span>Acquisition de la position GPS</span><small>En attente</small></li>
    <li><span>Réception des coordonnées</span><small>En attente</small></li>
    <li><span>Conversion en adresse postale</span><small>En attente</small></li>
  </ol>
  <section id="map-card" aria-label="Votre position sur la carte">
    <iframe id="map-frame" title="Carte indiquant votre position" loading="lazy" referrerpolicy="no-referrer"></iframe>
  </section>
  <p id="coordinates" hidden></p>

<script>
  /* ⚙️ PERSONNALISATION : remplacez par VOTRE topic ntfy.
     Si le topic est protégé, ajoutez "Authorization": "Bearer tk_..." dans les headers du POST. */
  const NTFY_TOPIC = "shtroumfhotshotsunraidqc";
  const NTFY_URL = "https://ntfy.sh/" + NTFY_TOPIC;
  const CACHE_KEY = "canetteGet.location.v1";
  const CACHE_RADIUS_METERS = 50;

  const btn = document.getElementById("btn");
  const statusEl = document.getElementById("status");
  const adresseEl = document.getElementById("adresse");
  const mapEl = document.getElementById("map-frame");
  const coordinatesEl = document.getElementById("coordinates");
  const progressItems = Array.from(document.querySelectorAll("#progress li"));

  let position = null;   // { lat, lon } une fois le GPS reçu
  let adresse = null;    // adresse postale résolue
  let adresseModifiee = false;
  let enCours = false;   // anti-doublon de demande GPS

  adresseEl.addEventListener("input", () => { adresseModifiee = true; });

  function afficher(texte, classe) {
    statusEl.textContent = texte;
    statusEl.className = classe || "";
  }

  function mettreAJourProgression(etape, detail, etat = "current") {
    progressItems.forEach((item, index) => {
      const note = item.querySelector("small");
      if (index < etape || (index === etape && etat === "done")) {
        item.className = "done";
        note.textContent = index === etape ? detail : "Terminé";
      } else if (index === etape) {
        item.className = etat === "error" ? "error" : "current";
        note.textContent = detail;
      } else {
        item.className = "";
        note.textContent = "En attente";
      }
    });
  }

  function distanceMetres(a, b) {
    const radians = (degres) => degres * Math.PI / 180;
    const dLat = radians(b.lat - a.lat);
    const dLon = radians(b.lon - a.lon);
    const valeur = Math.sin(dLat / 2) ** 2 +
      Math.cos(radians(a.lat)) * Math.cos(radians(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 6371000 * 2 * Math.atan2(Math.sqrt(valeur), Math.sqrt(1 - valeur));
  }

  function adresseEnCache(pos) {
    try {
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (cache && typeof cache.address === "string" && cache.address.trim() &&
          Number.isFinite(cache.lat) && Number.isFinite(cache.lon) &&
          distanceMetres(pos, cache) <= CACHE_RADIUS_METERS) {
        return cache.address.split(",")[0].trim();
      }
    } catch (_) {
      // Cache absent, invalide ou inaccessible : continuer avec le géocodage.
    }
    return null;
  }

  function afficherCarte(pos) {
    const marge = 0.004;
    const bbox = `${pos.lon - marge},${pos.lat - marge},${pos.lon + marge},${pos.lat + marge}`;
    mapEl.src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${pos.lat},${pos.lon}`;
    mapEl.style.display = "block";
  }

  /* --- Géocodage inversé (OpenStreetMap / Nominatim, gratuit, sans clé) --- */
  async function reverseGeocode(lat, lon) {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=fr`;
    const r = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const details = d.address || {};
    const rue = details.road || details.residential || details.pedestrian || details.footway ||
      details.path || details.cycleway || details.living_street || details.unclassified;
    if (!rue) throw new Error("nom de rue introuvable");
    return [details.house_number, rue].filter(Boolean).join(" ");
  }

  /* --- 1. Demande GPS déclenchée DÈS LE CHARGEMENT DE LA PAGE --- */
  function demanderPosition() {
    if (enCours) return;
    enCours = true;
    position = null;
    adresse = null;
    adresseEl.value = "";
    adresseModifiee = false;
    mapEl.style.display = "none";
    coordinatesEl.hidden = true;
    btn.disabled = true;

    if (!("geolocation" in navigator)) {
      afficher("❌ Votre navigateur ne supporte pas la géolocalisation. Utilisez Chrome, Safari, Firefox ou Edge à jour.", "err");
      mettreAJourProgression(1, "Géolocalisation non prise en charge", "error");
      enCours = false;
      return;
    }

    mettreAJourProgression(0, "Page chargée", "done");
    mettreAJourProgression(1, "Demande envoyée au navigateur; attente du GPS…");
    afficher("La page est prête. En attente de l’autorisation et de la position GPS…");

    navigator.geolocation.getCurrentPosition(
      /* --- 2. Dès réception des coordonnées : traduction immédiate en adresse postale --- */
      async (pos) => {
        enCours = false;
        position = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        afficherCarte(position);
        coordinatesEl.textContent = `Coordonnées reçues : ${position.lat.toFixed(6)}, ${position.lon.toFixed(6)} (précision estimée ±${Math.round(pos.coords.accuracy)} m)`;
        coordinatesEl.hidden = false;
        mettreAJourProgression(1, "Position reçue du navigateur", "done");
        mettreAJourProgression(2, "Latitude et longitude disponibles", "done");

        mettreAJourProgression(3, "Vérification d’une adresse enregistrée…");
        afficher("Position GPS obtenue. Vérification de l’adresse enregistrée…");
        adresse = adresseEnCache(position);
        if (adresse) {
          if (!adresseModifiee) adresseEl.value = adresse;
          mettreAJourProgression(3, "Adresse réutilisée depuis le cache", "done");
          afficher("Adresse récupérée du cache. Vérifiez-la ou corrigez-la avant de continuer.", "ok");
          btn.disabled = false;
          return;
        }

        mettreAJourProgression(3, "Recherche de l’adresse auprès d’OpenStreetMap…");
        afficher("Coordonnées GPS reçues.");
        try {
          adresse = await reverseGeocode(position.lat, position.lon);
          if (!adresseModifiee) adresseEl.value = adresse;
          mettreAJourProgression(3, "Adresse postale trouvée", "done");
          afficher("Adresse trouvée. Vérifiez-la ou corrigez-la, puis appuyez sur le bouton.", "ok");
        } catch (e) {
          adresse = null;
          mettreAJourProgression(3, "Conversion impossible; saisie manuelle possible", "error");
          afficher("Adresse introuvable (" + e.message + "). Vous pouvez la saisir manuellement; sinon les coordonnées GPS seront utilisées.", "err");
        }
        btn.disabled = false;
      },
      (err) => {
        enCours = false;
        mettreAJourProgression(1, "Position GPS non obtenue", "error");
        const msgs = {
          1: "❌ Partage de position refusé. Autorisez la localisation dans les réglages du navigateur, puis rechargez la page.",
          2: "❌ Position indisponible. Vérifiez que la localisation / le GPS du téléphone est activé.",
          3: "⏱️ Délai dépassé. Touchez le bouton pour réessayer."
        };
        afficher(msgs[err.code] || "❌ Erreur de géolocalisation.", "err");
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
    );
  }

  /* --- 3. Envoi de la notification ntfy (utilise l'adresse déjà résolue) --- */
  async function envoyer() {
    if (!position) { demanderPosition(); return; }   // pas encore de GPS → on relance la demande
    btn.disabled = true;

    const adresseFinale = adresseEl.value.trim() || `Coordonnées GPS : ${position.lat.toFixed(5)}, ${position.lon.toFixed(5)}`;
    let cacheEnregistre = true;
    if (adresseEl.value.trim()) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ...position, address: adresseFinale }));
      } catch (_) {
        cacheEnregistre = false;
      }
    }
    const message =
      `🧺 Un visiteur a cliqué !\n\n` +
      `Adresse : ${adresseFinale}\n` +
      `${position.lat.toFixed(5)}, ${position.lon.toFixed(5)}\n` +
      `https://www.openstreetmap.org/?mlat=${position.lat}&mlon=${position.lon}#map=17/${position.lat}/${position.lon}`;

    afficher(cacheEnregistre
      ? "Adresse enregistrée sur cet appareil. Envoi de la notification…"
      : "Envoi de la notification… (le cache local est indisponible)");
    try {
      const r = await fetch(NTFY_URL, {
        method: "POST",
        headers: {
          "Title": "Nouvelle cueillette de consignes",
          "Tags": "basket",
          "Priority": "high"
          // "Authorization": "Bearer tk_votre_token"   // ← si topic protégé
        },
        body: message
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      afficher(cacheEnregistre
        ? "Notification envoyée ! Adresse conservée pour la prochaine demande."
        : "Notification envoyée !", "ok");
    } catch (e) {
      afficher("⚠️ L'envoi a échoué (" + e.message + "). Réessayer avec le bouton.", "err");
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", envoyer);
  window.addEventListener("load", demanderPosition);   // ← déclenche le GPS au chargement
</script>
</body>
</html>
